
[project]
name = "pyrobotiqgripper"
version = "3.3.11"
authors = [{name="Benoit CASTETS", email = "opensourceeng@gmail.com"}]
description = "Python Driver for Robotiq Grippers"
readme = "README.md"
requires-python = ">=3.10.0"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Dependencies required at import time. Keep as-is: pymodbus, pyserial, numpy.
# This is what every installer (pip, uv) always pulls in.
dependencies = [
    "pymodbus>=3.12.1",
    "pyserial>=3.5",
    "numpy>=1.28",
]

[project.optional-dependencies]

docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
]

all = [
    "pandas>=1.5",
    "pygame-ce>=2.5.2",
    "pynput>=1.7.6",
    "pyautogui>=0.9.54",
    "PySide6>=6.5",
    "sounddevice>=0.4.6",
]

[dependency-groups]

dev = [
  "pytest>=9.1.1",
  "scipy>=1.15.3",
  "matplotlib>=3.10.9",
  "asciichartpy>=1.5.25",
  "pyrobotiqgripper[all]",
]

[build-system]
requires = ["uv_build>=0.9.4,<1.0.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pyrobotiqgripper"
module-root = ""

[tool.uv.sources]
pyrobotiqgripper = { workspace = true }

[project.urls]
homepage = "https://github.com/castetsb/pyRobotiqGripper"
tracker = "https://github.com/castetsb/pyRobotiqGripper/issues"

[project.scripts]
pyrobotiqgripper-joystick = "pyrobotiqgripper.joystick_cli:main"
