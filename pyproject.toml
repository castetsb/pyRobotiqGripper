
[project]
name = "pyrobotiqgripper"
version = "3.3.2"
authors = [{name="Benoit CASTETS", email = "opensourceeng@gmail.com"}]
description = "Python Driver for Robotiq Grippers"
readme = "README.rst"
requires-python = ">=3.10.0"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Dependencies required at import time. Keep as-is: pymodbus, pyserial, numpy.
# This is what every installer (pip, uv) always pulls in.
dependencies = [
    "pymodbus>=3.12.1",
    "pyserial>=3.5",
    "numpy>=1.28",
]

[project.optional-dependencies]

docs = [
  "sphinx",
  "sphinx-rtd-theme",
  "sphinxcontrib-youtube",
]

all = [
    "pandas>=1.5",
    "pygame-ce>=2.5.2",
    "pynput>=1.7.6",
    "pyautogui>=0.9.54",
    "PyQt5>=5.15",
    "PyQtChart>=5.15",
    "sounddevice>=0.4.6",
    # PyQt5-Qt5/PyQtChart-Qt5 (the bundled Qt binaries) stopped publishing
    # Windows wheels after 5.15.2 (later releases are Linux/macOS only), so
    # pin to the last Windows-compatible build there; other platforms are
    # free to resolve newer.
    "PyQt5-Qt5==5.15.2 ; sys_platform == 'win32'",
    "PyQtChart-Qt5==5.15.2 ; sys_platform == 'win32'",
]

[dependency-groups]

dev = [
  "pytest>=9.1.1",
  "scipy>=1.15.3",
  "matplotlib>=3.10.9",
  "asciichartpy>=1.5.25",
  "pyrobotiqgripper[all]",
]

[build-system]
requires = ["uv_build>=0.9.4,<1.0.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["pyrobotiqgripper"]
module-root = ""

[tool.uv.sources]
pyrobotiqgripper = { workspace = true }

[project.urls]
homepage = "https://github.com/castetsb/pyRobotiqGripper"
tracker = "https://github.com/castetsb/pyRobotiqGripper/issues"

[project.scripts]
pyrobotiqgripper-joystick = "pyrobotiqgripper.joystick_cli:main"
